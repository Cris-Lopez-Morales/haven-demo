  --sage:#2c3d2e; --paper:#141d18; --white:#1d2921; --warm:#2d3024;
  --soft:#25332a; --hover:#354936; --hero:#25392a;

  --on-accent:#18271a; --accent-hover:#d2e7be;

  --strong-line:#536d49; --shadow:rgba(0,0,0,.30); --scrim:rgba(4,10,6,.72);
  --glass:rgba(29,41,33,.97); --focus:#c5dea9;

:root{--radius:16px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none;font-size:14px;line-height:1.5}

/* Haven 1.1: gentle, finite motion. Never block input while animating. */
:root{}
html{scroll-behavior:smooth}
.property-card{scroll-margin-top:24px;transition:transform .3s var(--motion-ease),box-shadow .3s var(--motion-ease),border-color .25s}
.property-card.reveal-pending{opacity:0;transform:translateY(14px)}
.image-link img{transition:transform .65s var(--motion-ease)}
button,.btn,.nav-item{transition:background .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s var(--motion-ease)}
.save-button .icon{transition:fill .22s,color .22s,stroke .22s}
.hero-link .icon,.analyze-button .icon,.sidebar-note button .icon{transition:transform .3s var(--motion-ease)}
.filter-bar:focus-within{box-shadow:0 0 0 3px var(--shadow);border-color:var(--line)}
.filter-bar{transition:border-color .2s,box-shadow .2s}
.type-tabs button,.view-toggle button{transition:background .24s,color .24s,box-shadow .24s}
.modal[open]::backdrop{animation:haven-backdrop-in .25s ease-out}
.toast{animation:haven-toast-in .32s var(--motion-ease)}
.sidebar{transition:transform .32s var(--motion-ease)}
.results-pagination{display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center;padding:30px 16px 6px;color:var(--muted)}
.results-pagination p{font-size:11px;letter-spacing:.05px}
.results-pagination strong{color:var(--ink);font-weight:550}
.results-progress{width:130px;height:3px;border-radius:6px;overflow:hidden;background:var(--line)}
.results-progress span{display:block;height:100%;background:var(--green);border-radius:inherit;transition:width .4s var(--motion-ease)}
.load-more-button{margin-top:3px;min-width:205px;padding:12px 18px;background:var(--soft);border-color:var(--line);gap:17px}
.load-more-button .icon{transition:transform .3s var(--motion-ease);width:15px;height:15px}
@keyframes haven-backdrop-in{
from{background-color:var(--sage);backdrop-filter:blur(0)}
to{background-color:var(--sage);backdrop-filter:blur(4px)}
}
@keyframes haven-toast-in{
from{opacity:0;transform:translateY(8px) scale(.98)}
to{opacity:1;transform:translateY(0) scale(1)}
}
@media(hover:hover) and (prefers-reduced-motion:no-preference){
.property-card:not(.reveal-pending):hover{transform:translateY(-4px);box-shadow:0 12px 28px var(--shadow)}
.property-card:hover .image-link img{transform:scale(1.035)}
.hero-link:hover .icon,.analyze-button:hover .icon,.sidebar-note button:hover .icon{transform:translateX(3px)}
.load-more-button:hover .icon{transform:translateY(3px)}
}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.property-card.reveal-pending{opacity:1;transform:none}
.property-card:hover .image-link img,.save-button:hover{transform:none}
}
@media print{
.reveal-pending{opacity:1!important;transform:none!important}
.results-pagination{display:none!important}
}
/* 1.2 — a quiet property picker and a persistent, non-modal assistant. */
.calculator-context{position:relative;z-index:5;gap:16px;padding:16px 18px;align-items:center}

.picker-input-wrap{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 9px;transition:border-color .18s,box-shadow .18s}

/* Appearance stays outside the page state: switching never resets inputs or chat. */
.appearance{position:relative;flex:none}

.appearance-toggle svg{width:16px;height:16px}
.appearance-menu{position:absolute;z-index:90;right:0;top:calc(100% + 9px);width:190px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--white);box-shadow:0 10px 35px var(--shadow);animation:haven-pop .16s ease both}
.appearance-menu[hidden]{display:none}

.appearance-menu button:hover{background:var(--soft)}
.appearance-menu button[aria-checked=true]{background:var(--sage);color:var(--green)}
.appearance-menu svg{width:15px;height:15px;flex:none}
.appearance-check{margin-left:auto;visibility:hidden}.appearance-menu [aria-checked=true] .appearance-check{visibility:visible}
@media(max-width:780px){.topbar-actions{gap:9px}.appearance-menu{right:-45px}}
@media(max-width:420px){.topbar-actions{gap:7px}.topbar{gap:8px}.topbar-actions .demo-pill{padding:5px 7px;font-size:8px}.appearance-toggle{width:30px;height:30px}.breadcrumb{gap:6px}}
@media(prefers-reduced-motion:reduce){.appearance-menu{animation:none}}
@media(max-width:780px){.appearance-menu{right:auto;left:0}}
@media(max-width:360px){
